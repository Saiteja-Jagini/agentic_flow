name: Agent verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:discovery
      - run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-reports-${{ matrix.os }}
          path: runs/
          retention-days: 7
          if-no-files-found: warn
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run agent -- demo --browser chromium,firefox,webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-matrix-report
          path: runs/
          retention-days: 7
